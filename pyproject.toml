[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lirts"
version = "0.6.0"
description = "A btop-style terminal dashboard for ports, processes, Docker containers and the services behind them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kepposmetsä" }]
keywords = ["tui", "ports", "docker", "monitoring", "developer-tools", "netstat", "lsof"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "psutil>=5.9",
    "textual>=0.80",
    "typer>=0.12",
    "rich>=13",
    "docker>=7",
    "pyperclip>=1.8",
    "aiohttp>=3.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2"]
dev = [
    "mcp>=2.2",
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "types-PyYAML",
    "types-psutil",
]

[project.scripts]
lirts = "lirts.cli:app"

[project.urls]
Homepage = "https://github.com/EvilUnicornLabs/lirts"
Repository = "https://github.com/EvilUnicornLabs/lirts"
Issues = "https://github.com/EvilUnicornLabs/lirts/issues"
Changelog = "https://github.com/EvilUnicornLabs/lirts/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["lirts*"]

[tool.setuptools.package-data]
lirts = ["tui/*.tcss", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF012", "SIM108", "B008", "RUF001", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["lirts"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["venv", "build", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
